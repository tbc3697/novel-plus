mode:
  # 单机模式
  type: Standalone
  # 元数据持久化
  repository:
    # 数据库持久化
    type: JDBC

# 数据源配置
dataSources:
  ds_1:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://www.tbc.pub:16033/novel_plus_2?allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: novel
    password: 123456
  ds_2:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://www.tbc.pub:16033/information_schema?allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: novel
    password: 123456
# 规则配置
rules:
  - !SINGLE
    tables:
      - "*.*"
props:
  # 是否在日志中打印 SQL
  sql-show: true
  sql-simple: true
